name: Build Windows app and installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64 build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set version
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:REF_TYPE -eq 'tag') {
            if ($env:REF_NAME -notmatch '^v\d+\.\d+\.\d+$') { throw 'Release tags must use vMAJOR.MINOR.PATCH.' }
            $version = $env:REF_NAME.Substring(1)
          } else {
            [xml]$project = Get-Content 'MouseWithOutBorders/MouseWithOutBorders.csproj'
            $version = [string]$project.Project.PropertyGroup.Version
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Validate PowerShell installer scripts
        shell: pwsh
        run: |
          $scripts = @(Get-ChildItem scripts, tests -Filter *.ps1 -Recurse)
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName, [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) { throw "PowerShell parser errors in $script : $errors" }
          }

      - name: Test isolated runtime, UI and artifact lifecycle
        shell: pwsh
        run: ./scripts/test.ps1

      - name: Test native Windows clipboard formats in disposable CI
        shell: pwsh
        run: dotnet run --project tests/Clipboard.WindowsTests/Clipboard.WindowsTests.csproj --configuration Release

      - name: Test native pointer visibility state
        shell: pwsh
        run: dotnet run --project tests/Pairing.UiTests/Pairing.UiTests.csproj --configuration Release -- --native-visibility-only

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build current distribution
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build.ps1 -Version $env:BUILD_VERSION

      - name: Test installation, running-app upgrades and uninstall
        timeout-minutes: 5
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem "dist/current/installer/*-Setup.exe") | Select-Object -First 1
          if (-not $installer) { throw "Setup.exe was not produced" }
          $legacy = 'dist/MouseWithOutBorders-0.1.2-Portable.zip'
          $fixtureUrl = 'https://api.github.com/repos/aesgalexis/mouse-without-borders/releases/assets/668367465?download=1'
          Write-Host 'Downloading the legacy upgrade fixture through the GitHub API.'
          try {
            curl.exe --fail --silent --show-error --location --connect-timeout 10 --max-time 35 --retry 2 --retry-delay 2 --retry-all-errors --header 'Accept: application/octet-stream' --output $legacy $fixtureUrl
            if ($LASTEXITCODE -ne 0) { throw 'Could not download the legacy upgrade fixture.' }
            if ((Get-FileHash -LiteralPath $legacy -Algorithm SHA256).Hash -ine '876f9d244fe80d3cc81e0ff305533df4ea5e207ac8584db71b328d9bc856f4c3') {
              throw 'Legacy test fixture checksum mismatch.'
            }
            ./tests/Installer.SmokeTests.ps1 -InstallerPath $installer.FullName -LegacyPortablePath $legacy
          }
          finally { Remove-Item -LiteralPath $legacy -Force -ErrorAction SilentlyContinue }

      - name: Upload installer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MouseWithOutBorders-Installer-Logs
          path: |
            dist/installer-tests/*.log
          if-no-files-found: ignore

      - name: Upload installer and portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MouseWithOutBorders-Windows-x64
          path: |
            dist/current/installer/*-Setup.exe
            dist/current/portable/*-Portable.zip
            dist/current/SHA256SUMS.txt
          if-no-files-found: error

      # Create-only publication keeps versioned downloads and WinGet hashes stable.
      # A second run or tag must never replace assets of an existing release.
      - name: Create versioned release
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $releaseExists = $false
          try {
            $releaseInfo = gh release view "$tag" --repo "$env:RELEASE_REPOSITORY" --json tagName 2>$null
            $releaseExists = ($LASTEXITCODE -eq 0)
          } catch { $releaseExists = $false }
          if ($releaseExists) {
            Write-Host "Release $tag already exists. Not replacing published downloads."
            exit 0
          }
          $assets = @(Get-ChildItem "dist/current/installer/*-Setup.exe" | Select-Object -ExpandProperty FullName)
          $assets += @(Get-ChildItem "dist/current/portable/*-Portable.zip" | Select-Object -ExpandProperty FullName)
          $assets += @(Resolve-Path "dist/current/SHA256SUMS.txt" | Select-Object -ExpandProperty Path)
          $notesPath = "docs/releases/$tag.md"
          $notesArgs = if (Test-Path -LiteralPath $notesPath) { @('--notes-file', $notesPath) } else { @('--generate-notes') }
          # Publish main releases at /releases/latest. Tag-only builds remain previews.
          $publicationFlag = if ($env:GITHUB_REF -eq 'refs/heads/main') { '--latest' } else { '--prerelease' }
          gh release create "$tag" $assets --repo "$env:RELEASE_REPOSITORY" --target "$env:GITHUB_SHA" --title "Mouse, with out borders $tag" $publicationFlag @notesArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
